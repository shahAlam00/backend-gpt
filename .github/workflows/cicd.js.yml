name: Node.js CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Backup .env
        run: |
          if [ -f .env ]; then
            mv .env /tmp/env_backup
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Restore .env
        run: |
          if [ -f /tmp/env_backup ]; then
            mv /tmp/env_backup .env
          fi

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint .

      - name: Build Project
        run: npm run build --if-present

      - name: Restart PM2 App
        run: |
          pm2 list
          pm2 restart backend-gpt --update-env